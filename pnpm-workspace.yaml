packages:
  - packages/*
  - tooling/*

# lefthook's postinstall links the platform binary the git hooks run.
allowBuilds:
  lefthook: true

# Every shared dependency version lives here so the packages cannot drift apart.
catalog:
  "@arethetypeswrong/cli": ^0.18.5
  "@changesets/changelog-github": ^1.0.0
  "@changesets/cli": ^3.0.1
  "@standard-schema/spec": ^1.1.0
  "@types/chrome": ^0.2.8
  # Declares the ambient `browser` global. Used only by the extension package's conformance tests, which prove its structural storage-area interface is satisfied by every browser's real declarations.
  "@types/firefox-webext-browser": ^143.0.0
  "@types/node": ^24.13.3
  "@types/webextension-polyfill": ^0.12.6
  "@vitest/coverage-v8": ^4.1.11
  happy-dom: ^20.13.2
  lefthook: ^2.1.12
  oxfmt: ^0.66.0
  oxlint: ^1.81.0
  publint: ^0.3.24
  tsdown: ^0.22.14
  turbo: ^2.10.12
  # The classic TypeScript line. `latest` on npm is now the Go-native 7.x port, which the declaration-emit and typecheck tooling here is not validated against; revisit once tsdown and vitest publish support for it.
  typescript: ^6.0.3
  vitest: ^4.1.11
  zod: ^4.5.4

minimumReleaseAgeExclude:
  - happy-dom@20.13.2
