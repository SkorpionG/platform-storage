packages:
  - packages/*
  - tooling/*
  # Demonstrations of the published packages. Every one is private, so none is ever versioned or published.
  - examples/*

# lefthook's postinstall links the platform binary the git hooks run.
allowBuilds:
  lefthook: true

# Every shared dependency version lives here so the packages cannot drift apart.
catalog:
  "@arethetypeswrong/cli": ^0.18.5
  "@changesets/cli": ^3.0.1
  # Used only by the React Native package's conformance test, which proves its structural `AsyncStorageLike` is satisfied by the real AsyncStorage. `src` never imports it.
  "@react-native-async-storage/async-storage": ^3.1.1
  "@standard-schema/spec": ^1.1.0
  # Rendering React hooks in a test needs a renderer and the queries it depends on; both are development-only.
  "@testing-library/dom": ^10.4.1
  "@testing-library/react": ^16.3.0
  # Tailwind and its bundler plugins are released together and have to move together.
  "@tailwindcss/postcss": ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  "@types/chrome": ^0.2.8
  # Declares the ambient `browser` global. Used only by the extension package's conformance tests, which prove its structural storage-area interface is satisfied by every browser's real declarations.
  "@types/firefox-webext-browser": ^143.0.0
  "@types/node": ^24.13.3
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@types/webextension-polyfill": ^0.12.6
  "@vitejs/plugin-react": ^6.1.1
  "@vitest/coverage-v8": ^4.1.11
  # Rasterizes one source image into the icon sizes a manifest asks for, so none of them is committed. Pulls in sharp, which ships a platform binary.
  "@wxt-dev/auto-icons": ^1.1.2
  # Teaches WXT to compile JSX. Released against `wxt` rather than against React, so the two move together.
  "@wxt-dev/module-react": ^1.2.2
  happy-dom: ^20.13.2
  # Finds unused files, exports and dependencies across every workspace from one place, so only the root depends on it.
  knip: ^6.37.0
  lefthook: ^2.1.12
  next: ^16.3.5
  oxfmt: ^0.66.0
  oxlint: ^1.81.0
  # Renders the schema module with syntax highlighting in the browser demos. Small, and themed through the same tokens as everything else.
  prism-react-renderer: ^2.4.1
  publint: ^0.3.24
  react: ^19.3.0
  react-dom: ^19.3.0
  tailwindcss: ^4.3.3
  tsdown: ^0.22.14
  turbo: ^2.10.12
  # The classic TypeScript line. `latest` on npm is now the Go-native 7.x port, which the declaration-emit and typecheck tooling here is not validated against; revisit once tsdown and vitest publish support for it.
  typescript: ^6.0.3
  vite: ^8.2.2
  vitest: ^4.1.11
  # What launches a browser with the extension already loaded. An optional peer of WXT, and without it `wxt dev` quietly falls back to printing the directory to load by hand.
  web-ext: ^10.6.0
  # Builds the extension example for Chromium and Firefox from one source. It depends on Vite itself, so that example declares none of its own and takes whichever version WXT resolves.
  wxt: ^0.21.4
  zod: ^4.5.4

# The Expo SDK pins the exact versions it was built against, and they are not the ones the browser examples want: React 19.2.3 rather than 19.3.0, and AsyncStorage 2.x rather than 3.x. Expo Go ships the native half of each module at the SDK's version, so a newer JavaScript half would be talking to an older native one. A catalog of its own is what lets `@examples/expo` hold the SDK's set without moving every other example onto it.
catalogs:
  expo:
    "@expo/ui": ~57.0.18
    "@react-native-async-storage/async-storage": 2.2.0
    expo: ~57.0.23
    expo-constants: ~57.0.18
    expo-doctor: ^1.20.4
    expo-linking: ~57.0.10
    expo-router: ~57.0.21
    react: 19.2.3
    react-native: 0.86.3
    react-native-safe-area-context: ~5.7.0
    react-native-screens: ~4.26.0

minimumReleaseAgeExclude:
  - happy-dom@20.13.2
  - "@types/react@19.3.0"
  - react@19.3.0
  - "@types/react-dom@19.3.0"
  - react-dom@19.3.0
  - scheduler@0.28.0

# The copy `packages/react-native` keeps is a development dependency only, so that a type test can check `AsyncStorageLike` against its real declaration. Its peers are React and the whole React Native toolchain, which that package never runs, so they are removed from the graph rather than installed.
#
# Pinned to the 3.x line rather than named bare, because an override matches the parent by name and rewrites its manifest for every consumer: unpinned, this would strip the peers from the copy `@examples/expo` actually runs on a device, and AsyncStorage's own runtime imports `react-native` for `TurboModuleRegistry` and `Platform`. The Expo app is on the version its SDK bundles, which is 2.x, so the two do not collide.
overrides:
  "@react-native-async-storage/async-storage@^3>react": "-"
  "@react-native-async-storage/async-storage@^3>react-native": "-"
