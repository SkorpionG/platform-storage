name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # `turbo --affected` compares against the base branch, so it needs more than the default shallow clone.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Two passes, because they own different things: oxfmt formats code and leaves comment interiors and Markdown prose alone, and `format:comments` owns exactly those.
      - name: Format
        run: pnpm format:check

      # Unused files, exports and dependencies across the workspace. It reads only source, so it runs before the build and fails fast.
      - name: Unused code and dependencies
        run: pnpm knip

      # Every published export against the documentation convention. Source only, like the step above, and the one check that reads what a consumer's editor will show.
      - name: Public API documentation
        run: pnpm check-docs

      # One turbo invocation rather than one step per task. Turbo runs these as a single graph, in parallel across packages and across task types wherever the dependencies allow; five sequential steps would serialize them, and measurably so. A failure still names the task that broke it, as `@platform-storage/core#lint`.
      #
      # Pull requests check only what they touched; pushes to main check everything, so nothing reaches the release branch unverified.
      - name: Build, typecheck, lint, test, package
        run: >-
          pnpm exec turbo run build typecheck lint test check-package
          ${{ github.event_name == 'pull_request' && '--affected' || '' }}

      # The published packages alone, checked against `dependencies`. After the build, because strict mode reads the built declarations to tell a type that ships from one only the tests use; the script builds first too, which here is a cache hit.
      - name: Published dependencies
        run: pnpm knip:production

  # Everything above resolves `workspace:*` to `src`, so none of it runs what a consumer receives. This installs the packed tarballs with npm and uses them, which is the only check that would catch a broken `exports` map or a missing subpath.
  #
  # A job of its own, and not on pull requests: it installs from the registry, so it is slower than everything above and fails when npm does. What it guards — the packaging configuration — changes rarely, and `RELEASING.md` requires it before any release regardless.
  consumer:
    name: Consume the packed tarballs
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install, import and typecheck the tarballs
        run: pnpm verify-tarballs
