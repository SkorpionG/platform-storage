name: Release

# Releases are published by hand following `RELEASING.md`. This workflow is the optional alternative: it is the only way to publish with npm provenance, which the registry can only issue to a cloud CI run. It never fires on its own, so adding an `NPM_TOKEN` secret does not start publishing anything.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # Required for npm provenance, which links each published tarball to the workflow run and commit that produced it.
  id-token: write

jobs:
  # Publishing needs an `NPM_TOKEN` secret. The check lives in its own job because the `secrets` context cannot be read from a job-level `if`, and this way the release job below is skipped outright rather than starting and bailing.
  check-token:
    name: Check publish token
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Look for a publish token
        id: check
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "This run cannot publish: no \`NPM_TOKEN\` secret is set." >> "$GITHUB_STEP_SUMMARY"
            echo "Add one in Settings → Secrets and variables → Actions, then run this workflow again." >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    name: Release
    needs: check-token
    if: needs.check-token.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      # Which of the two this does depends on the state of `main` when the workflow is dispatched: with changesets still pending it opens or updates a version pull request, and with none pending it publishes whatever version `main` already carries. Releasing through here therefore means dispatching once to raise the version pull request, merging it, and dispatching again to publish.
      - name: Version or publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
