<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>platform-storage · browser playground</title>
    <script>
      /*
        Paints the right theme before the first frame, so a reload never flashes the other one. This has to run before any module loads, which is why the key and its values are spelled out here rather than imported from the schema. Reading the raw entry is the point worth noticing: the stored value is ordinary JSON text under an ordinary key, and anything on the origin can read it.
      */
      try {
        const raw = window.localStorage.getItem("theme");
        const theme = raw === null ? "system" : JSON.parse(raw);
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;

        if (theme === "dark" || (theme !== "light" && prefersDark)) {
          document.documentElement.classList.add("dark");
        }
      } catch {
        // A corrupt or unreadable entry just means the default theme.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
